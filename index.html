<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forced Fullscreen Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #videoPlayer {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
        
        #dropZone {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            font-size: 24px;
            text-align: center;
            z-index: 1000;
            border: 4px dashed #666;
        }
        
        #dropZone.dragover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        
        #dropZone p {
            padding: 20px;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="videoPlayer" playsinline loop></video>
    </div>
    
    <div id="dropZone">
        <p>🎬 Drop your video file here<br><br>⚠️ Video will play in fullscreen with no controls<br>Press ESC to exit (only way to stop)</p>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const dropZone = document.getElementById('dropZone');
        
        // Disable all user interactions with video
        videoPlayer.addEventListener('click', (e) => {
            e.preventDefault();
            return false;
        });
        
        videoPlayer.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });
        
        videoPlayer.addEventListener('keydown', (e) => {
            e.preventDefault();
            return false;
        });
        
        videoPlayer.addEventListener('play', (e) => {
            e.preventDefault();
            // Force video to keep playing
            videoPlayer.play();
        });
        
        videoPlayer.addEventListener('pause', (e) => {
            e.preventDefault();
            // Immediately resume if paused
            videoPlayer.play();
        });
        
        // Prevent any keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Allow ESC to exit fullscreen (only way to stop)
            if (e.key === 'Escape') {
                return true;
            }
            
            // Block spacebar (pause), arrow keys (seek), etc.
            if (e.code === 'Space' || 
                e.key === 'ArrowLeft' || 
                e.key === 'ArrowRight' || 
                e.key === 'ArrowUp' || 
                e.key === 'ArrowDown' ||
                e.key === 'f' ||  // fullscreen
                e.key === 'F') {
                e.preventDefault();
                return false;
            }
        });
        
        // Prevent mouse interactions
        videoPlayer.style.pointerEvents = 'none';
        
        // Handle file drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            const file = e.dataTransfer.files[0];
            
            if (file && file.type.startsWith('video/')) {
                const videoUrl = URL.createObjectURL(file);
                videoPlayer.src = videoUrl;
                
                // Hide drop zone
                dropZone.classList.add('hidden');
                
                // Force fullscreen
                const container = document.getElementById('container');
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
                
                // Start playing
                videoPlayer.play().catch(err => {
                    console.log('Autoplay failed:', err);
                });
                
                // Force loop (optional - remove if you want it to stop at end)
                videoPlayer.loop = true;
                
                // Clean up object URL when video is done
                videoPlayer.addEventListener('ended', () => {
                    URL.revokeObjectURL(videoUrl);
                });
            } else {
                alert('Please drop a valid video file');
            }
        });
        
        // Handle fullscreen change
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // If exited fullscreen, show drop zone again
                dropZone.classList.remove('hidden');
                videoPlayer.pause();
                videoPlayer.src = '';
            }
        });
        
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) {
                dropZone.classList.remove('hidden');
                videoPlayer.pause();
                videoPlayer.src = '';
            }
        });
        
        // Prevent right-click context menu on entire page
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            return false;
        });
        
        console.log('Ready - drop a video file to start forced fullscreen playback');
    </script>
</body>
</html>
