<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut · timeline editor · like CapCut</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(145deg, #0b0f18 0%, #1a1f2c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .card {
            background: rgba(18, 22, 33, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.8rem 1.8rem 2.2rem;
            box-shadow: 0 25px 40px -10px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,215,0,0.15);
            width: 1000px;
            max-width: 98vw;
        }
        h1 {
            color: #f3e9c0;
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: -0.5px;
            margin: 0 0 0.25rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        h1 span {
            background: #9f7e1f;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.15rem 1rem;
            border-radius: 40px;
            color: #0e0b1a;
            letter-spacing: 0.3px;
        }
        .sub {
            color: #aca9bb;
            margin-bottom: 1.5rem;
            border-left: 3px solid #f5c542;
            padding-left: 1rem;
            font-size: 0.98rem;
        }
        .preview-container {
            background: #0c0f16;
            border-radius: 1.8rem;
            overflow: hidden;
            border: 2px solid #3f3d52;
            box-shadow: inset 0 0 15px #00000055;
            margin-bottom: 1.5rem;
            aspect-ratio: 9 / 16;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #171b24;
            transform: scaleX(-1);
            display: block;
            pointer-events: none;
        }
        .preview-label {
            position: absolute;
            bottom: 8px;
            right: 16px;
            background: #00000080;
            color: #ffd966;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            border: 1px solid #b58f3a;
            font-weight: 500;
            z-index: 5;
        }
        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(3px);
            color: white;
            font-size: 7rem;
            font-weight: 900;
            text-shadow: 0 0 30px #ffb347;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            border-radius: 1.8rem;
        }
        .countdown-overlay.visible {
            opacity: 1;
        }
        .aspect-toggle {
            display: flex;
            gap: 0.75rem;
            margin: 0 0 1.2rem 0;
            background: #1b1f2b;
            padding: 0.4rem;
            border-radius: 3rem;
            border: 1px solid #3e3c4a;
        }
        .aspect-option {
            flex: 1;
            text-align: center;
            padding: 0.6rem 0.8rem;
            border-radius: 2.5rem;
            background: transparent;
            color: #b1b9d0;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            border: none;
        }
        .aspect-option.active {
            background: #2f374b;
            color: #ffdb8e;
            box-shadow: 0 2px 6px black;
        }
        /* Timeline editor styles */
        .timeline-section {
            background: #1a1e2b;
            border-radius: 2rem;
            padding: 1.2rem 1.2rem 1.5rem;
            margin: 1.5rem 0 1.2rem;
            border: 1px solid #4a4553;
        }
        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e2d5b6;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }
        .cut-badge {
            background: #c44545;
            color: white;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .timeline-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .timeline-waveform {
            flex: 1;
            height: 60px;
            background: #0f1322;
            border-radius: 40px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border: 1px solid #5f5a6b;
            position: relative;
        }
        .cut-marker {
            position: absolute;
            width: 4px;
            height: 46px;
            background: #f5c542;
            border-radius: 4px;
            top: 7px;
            transform: translateX(-50%);
            pointer-events: none;
            box-shadow: 0 0 10px gold;
        }
        .cut-handle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border: 3px solid #f5c542;
            border-radius: 20px;
            top: 20px;
            transform: translateX(-50%);
            cursor: ew-resize;
            z-index: 30;
            box-shadow: 0 2px 8px black;
        }
        .cut-handle.start {
            background: #4ae07a;
        }
        .cut-handle.end {
            background: #e06a4a;
        }
        .time-labels {
            display: flex;
            justify-content: space-between;
            color: #9f9bb5;
            font-size: 0.8rem;
            margin-top: 8px;
            padding: 0 10px;
        }
        .cut-info {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 15px 0 5px;
            color: #cfc7ae;
            font-weight: 500;
        }
        .cut-info span {
            background: #2b3040;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            margin: 1.2rem 0 1rem;
        }
        button {
            background: #272b3a;
            border: none;
            color: #e9e1c7;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 0.8rem 1.8rem;
            border-radius: 2.5rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0d0f17;
            transition: 0.1s linear;
            border: 1px solid #5b5340;
            flex: 1 1 auto;
            justify-content: center;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0d0f17;
        }
        button:disabled {
            opacity: 0.4;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #0d0f17;
            pointer-events: none;
        }
        .record-btn {
            background: #8b2a2a;
            border-color: #c97c4b;
            box-shadow: 0 6px 0 #4d1a1a;
            color: white;
        }
        .stop-btn {
            background: #2f374b;
            border-color: #6f6d7a;
        }
        .download-btn {
            background: #2d5a3b;
            border-color: #64b07b;
            box-shadow: 0 6px 0 #1d3a25;
            color: #e6f0da;
        }
        .info-row {
            background: #1b1f2b;
            border-radius: 3rem;
            padding: 0.7rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #cbc5b2;
            border: 1px solid #47423b;
            font-size: 0.95rem;
            flex-wrap: wrap;
        }
        .badge {
            background: #323a4b;
            padding: 0.35rem 1rem;
            border-radius: 3rem;
            color: #ffdb8e;
            font-family: monospace;
        }
        .progress {
            height: 6px;
            background: #2a2e3c;
            border-radius: 10px;
            margin: 10px 0 5px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #f5c542;
            transition: width 0.2s;
        }
        .footnote {
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: #7b7a8a;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>✂️ CapCut‑style cutter <span>drag & cut</span></h1>
        <div class="sub">▼ record, then drag green/red handles to trim · download cut</div>

        <div class="aspect-toggle" id="aspectToggle">
            <button class="aspect-option active" data-aspect="portrait">📱 9:16 (shorts)</button>
            <button class="aspect-option" data-aspect="landscape">🖥️ 16:9 (long form)</button>
        </div>

        <div class="preview-container" id="previewContainer" style="aspect-ratio: 9/16;">
            <video id="preview" autoplay playsinline muted></video>
            <div class="countdown-overlay" id="countdownOverlay">5</div>
            <div class="preview-label" id="previewLabel">9:16 preview</div>
        </div>

        <!-- Timeline editor (visible only after recording) -->
        <div class="timeline-section" id="timelineSection" style="display: none;">
            <div class="timeline-header">
                <span>✂️ trim clips · drag handles</span>
                <span class="cut-badge" id="cutLengthDisplay">0:00 – 0:00</span>
            </div>
            <div class="timeline-preview">
                <div class="timeline-waveform" id="waveformContainer">
                    <div class="cut-marker" id="cutMarkerStart" style="left: 0%;"></div>
                    <div class="cut-marker" id="cutMarkerEnd" style="left: 100%;"></div>
                    <div class="cut-handle start" id="startHandle" style="left: 0%;"></div>
                    <div class="cut-handle end" id="endHandle" style="left: 100%;"></div>
                </div>
            </div>
            <div class="time-labels">
                <span id="timeStart">0:00</span>
                <span id="timeEnd">0:00</span>
            </div>
            <div class="cut-info">
                <span>🎬 start: <span id="startTimeDisplay">0.0s</span></span>
                <span>🏁 end: <span id="endTimeDisplay">0.0s</span></span>
            </div>
        </div>

        <div class="controls">
            <button class="record-btn" id="startBtn">🔴 Start recording</button>
            <button class="stop-btn" id="stopBtn" disabled>⏹️ Stop</button>
            <button class="download-btn" id="downloadBtn" disabled>💾 Download cut</button>
        </div>

        <div class="progress" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="info-row">
            <span>⏱️ <span id="timer">0:00</span></span>
            <span class="badge" id="status">⏸️ idle</span>
            <span>⚡ <span id="aspectIndicator">9:16</span></span>
        </div>
        <div class="footnote">
            ⬇️ after stop, drag handles to cut · then download only selected part
        </div>
    </div>

    <script>
        (function() {
            // DOM elements
            const previewVideo = document.getElementById('preview');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const timerSpan = document.getElementById('timer');
            const statusSpan = document.getElementById('status');
            const countdownOverlay = document.getElementById('countdownOverlay');
            const previewContainer = document.getElementById('previewContainer');
            const previewLabel = document.getElementById('previewLabel');
            const aspectIndicator = document.getElementById('aspectIndicator');
            const aspectOptions = document.querySelectorAll('.aspect-option');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            
            // Timeline elements
            const timelineSection = document.getElementById('timelineSection');
            const startHandle = document.getElementById('startHandle');
            const endHandle = document.getElementById('endHandle');
            const cutMarkerStart = document.getElementById('cutMarkerStart');
            const cutMarkerEnd = document.getElementById('cutMarkerEnd');
            const timeStart = document.getElementById('timeStart');
            const timeEnd = document.getElementById('timeEnd');
            const startTimeDisplay = document.getElementById('startTimeDisplay');
            const endTimeDisplay = document.getElementById('endTimeDisplay');
            const cutLengthDisplay = document.getElementById('cutLengthDisplay');
            const waveformContainer = document.getElementById('waveformContainer');

            // State
            let mediaStream = null;
            let mediaRecorder = null;
            let recordedChunks = [];
            let startTime = 0;
            let timerInterval = null;
            let recordingStartTime = 0;
            const MAX_RECORDING_MS = 24 * 60 * 60 * 1000;
            const CHUNK_INTERVAL = 5000;

            // Countdown
            let countdownInterval = null;
            let countdownValue = 5;
            let isCountdownActive = false;

            // Aspect
            let selectedAspect = 'portrait';
            
            // Video duration (set after recording)
            let videoDuration = 0;
            
            // Cut range (0-1)
            let cutStart = 0;
            let cutEnd = 1;
            
            // Dragging state
            let activeHandle = null;

            // UI Updates
            function updateAspectUI() {
                if (selectedAspect === 'portrait') {
                    previewContainer.style.aspectRatio = '9 / 16';
                    previewLabel.innerHTML = '9:16 preview';
                    aspectIndicator.innerText = '9:16';
                } else {
                    previewContainer.style.aspectRatio = '16 / 9';
                    previewLabel.innerHTML = '16:9 preview';
                    aspectIndicator.innerText = '16:9';
                }
            }

            aspectOptions.forEach(btn => {
                btn.addEventListener('click', () => {
                    aspectOptions.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedAspect = btn.dataset.aspect;
                    updateAspectUI();
                });
            });

            function formatTime(seconds) {
                const hrs = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                const secs = Math.floor(seconds % 60);
                if (hrs > 0) return `${hrs}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            function formatSeconds(sec) {
                return sec.toFixed(1) + 's';
            }

            function updateTimer() {
                if (!startTime) return;
                const elapsed = (Date.now() - startTime) / 1000;
                timerSpan.textContent = formatTime(elapsed);
            }

            function startTimer() {
                stopTimer();
                startTime = Date.now();
                timerSpan.textContent = '0:00';
                timerInterval = setInterval(updateTimer, 200);
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                startTime = 0;
            }

            function setUiForRecording(recording) {
                if (recording) {
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    downloadBtn.disabled = true;
                    statusSpan.innerHTML = '🔴 recording';
                    timelineSection.style.display = 'none';
                } else {
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    downloadBtn.disabled = recordedChunks.length === 0;
                    statusSpan.innerHTML = recordedChunks.length ? '⏸️ ready' : '⏹️ idle';
                    
                    // Show timeline if we have recording
                    if (recordedChunks.length > 0) {
                        showTimeline();
                    }
                }
            }

            // Show timeline and initialize cut handles
            function showTimeline() {
                // Create a temporary video to get duration
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const tempVideo = document.createElement('video');
                tempVideo.src = url;
                tempVideo.onloadedmetadata = () => {
                    videoDuration = tempVideo.duration;
                    
                    // Reset cut to full video
                    cutStart = 0;
                    cutEnd = 1;
                    
                    // Update timeline UI
                    updateCutHandles();
                    
                    // Show timeline section
                    timelineSection.style.display = 'block';
                    
                    // Cleanup
                    URL.revokeObjectURL(url);
                };
                tempVideo.load();
            }

            // Update handle positions and time displays
            function updateCutHandles() {
                const startPercent = cutStart * 100;
                const endPercent = cutEnd * 100;
                
                startHandle.style.left = startPercent + '%';
                endHandle.style.left = endPercent + '%';
                cutMarkerStart.style.left = startPercent + '%';
                cutMarkerEnd.style.left = endPercent + '%';
                
                const startSec = cutStart * videoDuration;
                const endSec = cutEnd * videoDuration;
                
                timeStart.innerText = formatTime(startSec);
                timeEnd.innerText = formatTime(endSec);
                startTimeDisplay.innerText = formatSeconds(startSec);
                endTimeDisplay.innerText = formatSeconds(endSec);
                cutLengthDisplay.innerText = `${formatTime(startSec)} – ${formatTime(endSec)}`;
            }

            // Handle drag
            function onMouseMove(e) {
                if (!activeHandle || !videoDuration) return;
                
                const rect = waveformContainer.getBoundingClientRect();
                let x = e.clientX - rect.left;
                x = Math.max(0, Math.min(rect.width, x));
                let percent = x / rect.width;
                
                if (activeHandle === 'start') {
                    // Start handle cannot go past end handle minus small gap
                    cutStart = Math.min(percent, cutEnd - 0.01);
                } else {
                    // End handle cannot go before start handle plus small gap
                    cutEnd = Math.max(percent, cutStart + 0.01);
                }
                
                updateCutHandles();
            }

            function onMouseUp() {
                activeHandle = null;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }

            // Attach drag listeners
            startHandle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                activeHandle = 'start';
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            endHandle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                activeHandle = 'end';
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            // Stop capture
            function stopAllTracks() {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }
                previewVideo.srcObject = null;
            }

            function stopCountdown() {
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                countdownOverlay.classList.remove('visible');
                isCountdownActive = false;
            }

            // Start capture
            async function startScreenAndCountdown() {
                recordedChunks = [];
                downloadBtn.disabled = true;
                stopAllTracks();
                stopCountdown();
                progressContainer.style.display = 'none';
                timelineSection.style.display = 'none';

                try {
                    const displayStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
                        audio: true,
                    });

                    let micStream = null;
                    try {
                        micStream = await navigator.mediaDevices.getUserMedia({
                            audio: { echoCancellation: true, noiseSuppression: true }
                        });
                    } catch (e) {}

                    const audioTracks = [];
                    displayStream.getAudioTracks().forEach(t => audioTracks.push(t));
                    if (micStream) micStream.getAudioTracks().forEach(t => audioTracks.push(t));

                    const videoTrack = displayStream.getVideoTracks()[0];
                    if (!videoTrack) throw new Error('No video track');

                    const finalStream = audioTracks.length 
                        ? new MediaStream([videoTrack, ...audioTracks])
                        : displayStream;

                    mediaStream = finalStream;
                    previewVideo.srcObject = mediaStream;

                    videoTrack.onended = () => {
                        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                        stopAllTracks();
                        stopCountdown();
                        setUiForRecording(false);
                        statusSpan.innerHTML = '⏹️ sharing stopped';
                    };

                    startCountdown();

                } catch (err) {
                    console.error(err);
                    statusSpan.innerHTML = '⚠️ cancelled';
                    setUiForRecording(false);
                }
            }

            function startCountdown() {
                stopCountdown();
                countdownValue = 5;
                countdownOverlay.textContent = countdownValue;
                countdownOverlay.classList.add('visible');
                isCountdownActive = true;

                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusSpan.innerHTML = '⏳ recording in 5...';

                countdownInterval = setInterval(() => {
                    countdownValue -= 1;
                    countdownOverlay.textContent = countdownValue;

                    if (countdownValue <= 0) {
                        stopCountdown();
                        if (!mediaStream) {
                            statusSpan.innerHTML = '⚠️ no stream';
                            setUiForRecording(false);
                            return;
                        }

                        try {
                            const mimeTypes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
                            let selectedMime = 'video/webm;codecs=vp8,opus';
                            for (let mt of mimeTypes) {
                                if (MediaRecorder.isTypeSupported(mt)) { selectedMime = mt; break; }
                            }

                            mediaRecorder = new MediaRecorder(mediaStream, {
                                mimeType: selectedMime,
                                videoBitsPerSecond: 25000000,
                                audioBitsPerSecond: 256000,
                            });

                            mediaRecorder.ondataavailable = (e) => {
                                if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                            };

                            mediaRecorder.onstop = () => {
                                stopTimer();
                                setUiForRecording(false);
                            };

                            mediaRecorder.start(CHUNK_INTERVAL);
                            recordingStartTime = Date.now();
                            startTimer();
                            setUiForRecording(true);
                            statusSpan.innerHTML = '🔴 recording';

                        } catch (e) {
                            console.error(e);
                            statusSpan.innerHTML = '⚠️ recorder error';
                        }
                    }
                }, 1000);
            }

            function stopAction() {
                if (isCountdownActive) {
                    stopCountdown();
                    statusSpan.innerHTML = '⏸️ cancelled';
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                } else if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                } else {
                    stopAllTracks();
                    setUiForRecording(false);
                }
            }

            // Download with cut applied
            function downloadWithCut() {
                if (recordedChunks.length === 0) return;

                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                statusSpan.innerHTML = '⏳ cutting & processing...';
                downloadBtn.disabled = true;

                const originalBlob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(originalBlob);
                
                const video = document.createElement('video');
                video.src = url;
                video.muted = true;
                video.crossOrigin = 'anonymous';
                video.playsInline = true;
                
                video.onloadedmetadata = () => {
                    const totalDur = video.duration;
                    const startSec = cutStart * totalDur;
                    const endSec = cutEnd * totalDur;
                    
                    // Set canvas dimensions based on aspect
                    let canvasWidth, canvasHeight;
                    if (selectedAspect === 'portrait') {
                        canvasHeight = Math.min(video.videoHeight, 1920);
                        canvasWidth = Math.round(canvasHeight * 9/16);
                    } else {
                        canvasWidth = Math.min(video.videoWidth, 1920);
                        canvasHeight = Math.round(canvasWidth * 9/16);
                    }
                    
                    if (canvasWidth % 2) canvasWidth += 1;
                    if (canvasHeight % 2) canvasHeight += 1;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = canvasWidth;
                    canvas.height = canvasHeight;
                    const ctx = canvas.getContext('2d', { alpha: false });
                    ctx.imageSmoothingEnabled = true;
                    
                    // Audio tracks
                    const audioStream = video.captureStream();
                    const audioTracks = audioStream.getAudioTracks();
                    
                    const canvasStream = canvas.captureStream(30);
                    const finalStream = new MediaStream();
                    finalStream.addTrack(canvasStream.getVideoTracks()[0]);
                    audioTracks.forEach(track => finalStream.addTrack(track));
                    
                    const finalRecorder = new MediaRecorder(finalStream, {
                        mimeType: 'video/webm;codecs=vp9,opus',
                        videoBitsPerSecond: 20000000,
                        audioBitsPerSecond: 256000
                    });
                    
                    const outputChunks = [];
                    finalRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) outputChunks.push(e.data);
                    };
                    
                    finalRecorder.onstop = () => {
                        const outputBlob = new Blob(outputChunks, { type: 'video/webm' });
                        const outputUrl = URL.createObjectURL(outputBlob);
                        const a = document.createElement('a');
                        a.href = outputUrl;
                        a.download = `cut_${selectedAspect}_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.webm`;
                        a.click();
                        
                        URL.revokeObjectURL(outputUrl);
                        URL.revokeObjectURL(url);
                        progressContainer.style.display = 'none';
                        statusSpan.innerHTML = '✅ cut download complete';
                        downloadBtn.disabled = false;
                    };
                    
                    finalRecorder.start();
                    
                    // Seek to start position and play
                    video.currentTime = startSec;
                    video.play();
                    
                    function drawFrame() {
                        if (video.paused || video.ended || video.currentTime >= endSec) {
                            if (finalRecorder.state !== 'inactive') finalRecorder.stop();
                            return;
                        }
                        
                        // Update progress
                        const progressPercent = ((video.currentTime - startSec) / (endSec - startSec)) * 100;
                        progressBar.style.width = progressPercent + '%';
                        
                        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                        
                        // Calculate crop
                        const vw = video.videoWidth;
                        const vh = video.videoHeight;
                        const targetAspect = selectedAspect === 'portrait' ? 9/16 : 16/9;
                        const videoAspect = vw / vh;
                        
                        let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
                        
                        if (selectedAspect === 'portrait') {
                            if (videoAspect > targetAspect) {
                                drawHeight = vh;
                                drawWidth = vh * targetAspect;
                                offsetX = (vw - drawWidth) / 2;
                            } else {
                                drawWidth = vw;
                                drawHeight = vw / targetAspect;
                                offsetY = (vh - drawHeight) / 2;
                            }
                        } else {
                            if (videoAspect > targetAspect) {
                                drawHeight = vh;
                                drawWidth = vh * targetAspect;
                                offsetX = (vw - drawWidth) / 2;
                            } else {
                                drawWidth = vw;
                                drawHeight = vw / targetAspect;
                                offsetY = (vh - drawHeight) / 2;
                            }
                        }
                        
                        ctx.drawImage(video, offsetX, offsetY, drawWidth, drawHeight, 0, 0, canvasWidth, canvasHeight);
                        
                        requestAnimationFrame(drawFrame);
                    }
                    
                    requestAnimationFrame(drawFrame);
                };
                
                video.load();
            }

            // Event listeners
            startBtn.addEventListener('click', startScreenAndCountdown);
            stopBtn.addEventListener('click', stopAction);
            downloadBtn.addEventListener('click', downloadWithCut);

            // Initial UI
            setUiForRecording(false);
            updateAspectUI();
        })();
    </script>
</body>
</html>
