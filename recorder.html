<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9:16 recorder · 5 sec preparation</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(145deg, #0b0f18 0%, #1a1f2c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(18, 22, 33, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 25px 40px -10px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,215,0,0.15);
            width: 680px;
            max-width: 94vw;
        }
        h1 {
            color: #f3e9c0;
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: -0.5px;
            margin: 0 0 0.25rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        h1 span {
            background: #9f7e1f;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.15rem 1rem;
            border-radius: 40px;
            color: #0e0b1a;
            letter-spacing: 0.3px;
        }
        .sub {
            color: #aca9bb;
            margin-bottom: 2rem;
            border-left: 3px solid #f5c542;
            padding-left: 1rem;
            font-size: 0.98rem;
        }
        .preview-container {
            background: #0c0f16;
            border-radius: 2rem;
            overflow: hidden;
            border: 2px solid #3f3d52;
            box-shadow: inset 0 0 15px #00000055;
            margin-bottom: 2rem;
            aspect-ratio: 9 / 16;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #171b24;
            transform: scaleX(-1); /* mirror for natural preview */
            display: block;
            pointer-events: none;
        }
        .preview-label {
            position: absolute;
            bottom: 8px;
            right: 16px;
            background: #00000080;
            color: #ffd966;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            border: 1px solid #b58f3a;
            font-weight: 500;
            letter-spacing: 0.3px;
            z-index: 5;
        }
        /* countdown overlay – appears on top of live preview */
        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(3px);
            color: white;
            font-size: 7rem;
            font-weight: 900;
            text-shadow: 0 0 30px #ffb347, 0 0 10px black;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            border-radius: 2rem;
        }
        .countdown-overlay.visible {
            opacity: 1;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            margin: 1.8rem 0 1.5rem;
        }
        button {
            background: #272b3a;
            border: none;
            color: #e9e1c7;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 0.8rem 1.8rem;
            border-radius: 2.5rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0d0f17;
            transition: 0.1s linear;
            border: 1px solid #5b5340;
            flex: 1 1 auto;
            justify-content: center;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0d0f17;
        }
        button:disabled {
            opacity: 0.4;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #0d0f17;
            pointer-events: none;
            filter: grayscale(0.6);
        }
        .record-btn {
            background: #8b2a2a;
            border-color: #c97c4b;
            box-shadow: 0 6px 0 #4d1a1a;
            color: white;
        }
        .stop-btn {
            background: #2f374b;
            border-color: #6f6d7a;
        }
        .download-btn {
            background: #2d5a3b;
            border-color: #64b07b;
            box-shadow: 0 6px 0 #1d3a25;
            color: #e6f0da;
        }
        .info-row {
            background: #1b1f2b;
            border-radius: 3rem;
            padding: 0.7rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #cbc5b2;
            border: 1px solid #47423b;
            font-size: 0.95rem;
            flex-wrap: wrap;
        }
        .badge {
            background: #323a4b;
            padding: 0.35rem 1rem;
            border-radius: 3rem;
            color: #ffdb8e;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .footnote {
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: #7b7a8a;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎬 9:16 Recorder <span>5s prep</span></h1>
        <div class="sub">▼ start sharing → 5‑second countdown → recording begins</div>

        <!-- preview with countdown overlay -->
        <div class="preview-container">
            <video id="preview" autoplay playsinline muted></video>
            <div class="countdown-overlay" id="countdownOverlay">5</div>
            <div class="preview-label">9:16 live · countdown then record</div>
        </div>

        <div class="controls">
            <button class="record-btn" id="startBtn">🔴 Start screen share</button>
            <button class="stop-btn" id="stopBtn" disabled>⏹️ Stop</button>
            <button class="download-btn" id="downloadBtn" disabled>💾 Download short</button>
        </div>

        <div class="info-row">
            <span>⏱️ <span id="timer">0:00</span></span>
            <span class="badge" id="status">⏸️ idle</span>
            <span>⚡ auto 9:16</span>
        </div>
        <div class="footnote">
            ⬇️ after countdown, recording starts — output is 1080x1920 with audio
        </div>
    </div>

    <script>
        (function() {
            // DOM elements
            const previewVideo = document.getElementById('preview');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const timerSpan = document.getElementById('timer');
            const statusSpan = document.getElementById('status');
            const countdownOverlay = document.getElementById('countdownOverlay');

            // state
            let mediaStream = null;            // raw stream from display (+ mic)
            let mediaRecorder = null;
            let recordedChunks = [];
            let startTime = 0;
            let timerInterval = null;

            // countdown related
            let countdownInterval = null;
            let countdownValue = 5;
            let isCountdownActive = false;
            let countdownFinished = false;      // becomes true when countdown reaches 0

            // helper: format mm:ss
            function formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            function updateTimer() {
                if (!startTime) return;
                const elapsed = (Date.now() - startTime) / 1000;
                timerSpan.textContent = formatTime(elapsed);
            }

            function startTimer() {
                stopTimer();
                startTime = Date.now();
                timerSpan.textContent = '0:00';
                timerInterval = setInterval(updateTimer, 200);
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                startTime = 0;
            }

            // UI update for recording state
            function setUiForRecording(recording) {
                if (recording) {
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    downloadBtn.disabled = true;
                    statusSpan.innerHTML = '🔴 recording';
                } else {
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    downloadBtn.disabled = recordedChunks.length === 0;
                    statusSpan.innerHTML = recordedChunks.length ? '⏸️ stopped · ready' : '⏹️ idle';
                }
            }

            // stop all tracks and clean up
            function stopAllTracks() {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }
                previewVideo.srcObject = null;
            }

            // clear countdown timer and hide overlay
            function stopCountdown() {
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                countdownOverlay.classList.remove('visible');
                isCountdownActive = false;
            }

            // START THE PROCESS: ask for screen, show preview, then begin countdown
            async function startScreenAndCountdown() {
                // reset previous recording data
                recordedChunks = [];
                downloadBtn.disabled = true;
                stopAllTracks();               // kill old stream if any
                stopCountdown();                // just in case

                try {
                    // 1. immediately ask for screen + audio (system audio optional)
                    const displayStream = await navigator.mediaDevices.getDisplayMedia({
                        video: true,
                        audio: true,
                    });

                    // 2. optionally request microphone
                    let micStream = null;
                    try {
                        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    } catch (e) {
                        console.log('No microphone, continuing without mic');
                    }

                    // 3. combine audio tracks (system + mic)
                    const audioTracks = [];
                    displayStream.getAudioTracks().forEach(t => audioTracks.push(t));
                    if (micStream) {
                        micStream.getAudioTracks().forEach(t => audioTracks.push(t));
                    }

                    const videoTrack = displayStream.getVideoTracks()[0];
                    if (!videoTrack) throw new Error('No video track');

                    // 4. create final mediaStream
                    let finalStream;
                    if (audioTracks.length) {
                        finalStream = new MediaStream([videoTrack, ...audioTracks]);
                    } else {
                        finalStream = displayStream;
                    }

                    mediaStream = finalStream;
                    previewVideo.srcObject = mediaStream;   // live preview starts

                    // 5. when user stops sharing via browser button, clean up
                    videoTrack.onended = () => {
                        // if recording is active, stop recorder
                        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                            mediaRecorder.stop();
                        }
                        stopAllTracks();
                        stopCountdown();
                        setUiForRecording(false);
                        statusSpan.innerHTML = '⏹️ sharing stopped';
                    };

                    // 6. now start the 5‑second countdown (preparation period)
                    startCountdown();

                } catch (err) {
                    console.error('Screen capture error:', err);
                    statusSpan.innerHTML = '⚠️ sharing cancelled/denied';
                    setUiForRecording(false);
                }
            }

            // Countdown function – assumes mediaStream is already active
            function startCountdown() {
                stopCountdown(); // clear any previous
                countdownValue = 5;
                countdownOverlay.textContent = countdownValue;
                countdownOverlay.classList.add('visible');
                isCountdownActive = true;
                countdownFinished = false;

                // update UI: during countdown we disable start, enable stop (to abort)
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusSpan.innerHTML = '⏳ recording starts in 5...';

                countdownInterval = setInterval(() => {
                    countdownValue -= 1;
                    countdownOverlay.textContent = countdownValue;

                    if (countdownValue <= 0) {
                        // COUNTDOWN FINISHED – start actual recording
                        stopCountdown(); // remove overlay & interval
                        countdownFinished = true;

                        // Make sure we still have a stream (maybe user aborted during countdown)
                        if (!mediaStream) {
                            statusSpan.innerHTML = '⚠️ stream lost';
                            setUiForRecording(false);
                            return;
                        }

                        // Set up MediaRecorder and start
                        try {
                            mediaRecorder = new MediaRecorder(mediaStream, {
                                mimeType: 'video/webm;codecs=vp8,opus',
                                videoBitsPerSecond: 4000000,
                            });

                            mediaRecorder.ondataavailable = (e) => {
                                if (e.data.size > 0) recordedChunks.push(e.data);
                            };

                            mediaRecorder.onstop = () => {
                                stopTimer();
                                setUiForRecording(false);
                                // we keep stream alive for preview
                            };

                            mediaRecorder.start();
                            startTimer();
                            setUiForRecording(true);
                            statusSpan.innerHTML = '🔴 recording';
                        } catch (e) {
                            console.error('Recorder failed:', e);
                            statusSpan.innerHTML = '⚠️ recorder error';
                        }
                    }
                }, 1000);
            }

            // Stop button: abort countdown OR stop recording
            function stopAction() {
                if (isCountdownActive) {
                    // Abort the countdown, but keep the stream preview (don't stop sharing)
                    stopCountdown();
                    statusSpan.innerHTML = '⏸️ countdown cancelled · ready';
                    startBtn.disabled = false;   // allow new start
                    stopBtn.disabled = true;      // stop button only useful during countdown/rec
                    // we do NOT stop the stream – preview stays
                } else if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    // stop recording, keep stream alive for preview
                    mediaRecorder.stop();
                } else {
                    // fallback: stop tracks if any
                    stopAllTracks();
                    setUiForRecording(false);
                }
            }

            // Download with 9:16 scaling (preserves audio)
            function scaleAndDownload() {
                if (recordedChunks.length === 0) return;

                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const hiddenVideo = document.createElement('video');
                hiddenVideo.src = url;
                hiddenVideo.muted = false;
                hiddenVideo.crossOrigin = 'anonymous';
                hiddenVideo.playsInline = true;

                hiddenVideo.onloadedmetadata = async () => {
                    try {
                        await hiddenVideo.play();

                        const originalStream = hiddenVideo.captureStream();
                        const originalAudioTracks = originalStream.getAudioTracks();

                        const canvas = document.createElement('canvas');
                        canvas.width = 1080;
                        canvas.height = 1920;
                        const ctx = canvas.getContext('2d');

                        const canvasStream = canvas.captureStream(30);
                        const canvasVideoTrack = canvasStream.getVideoTracks()[0];

                        const finalStream = new MediaStream();
                        finalStream.addTrack(canvasVideoTrack);
                        originalAudioTracks.forEach(t => finalStream.addTrack(t));

                        const finalRecorder = new MediaRecorder(finalStream, {
                            mimeType: 'video/webm;codecs=vp8,opus',
                            videoBitsPerSecond: 4000000
                        });
                        const scaledChunks = [];
                        finalRecorder.ondataavailable = (e) => scaledChunks.push(e.data);
                        finalRecorder.onstop = () => {
                            const finalBlob = new Blob(scaledChunks, { type: 'video/webm' });
                            const finalUrl = URL.createObjectURL(finalBlob);
                            const a = document.createElement('a');
                            a.href = finalUrl;
                            a.download = `shorts_9_16_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.webm`;
                            a.click();
                            URL.revokeObjectURL(finalUrl);
                            statusSpan.innerHTML = '✅ download ready (9:16)';
                        };

                        function drawFrame() {
                            if (hiddenVideo.paused || hiddenVideo.ended) {
                                finalRecorder.stop();
                                cancelAnimationFrame(frameReq);
                                return;
                            }
                            ctx.clearRect(0, 0, 1080, 1920);
                            const vw = hiddenVideo.videoWidth, vh = hiddenVideo.videoHeight;
                            const targetAspect = 9/16;
                            const videoAspect = vw / vh;
                            let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
                            if (videoAspect > targetAspect) {
                                drawHeight = vh;
                                drawWidth = vh * targetAspect;
                                offsetX = (vw - drawWidth) / 2;
                            } else {
                                drawWidth = vw;
                                drawHeight = vw / targetAspect;
                                offsetY = (vh - drawHeight) / 2;
                            }
                            ctx.drawImage(hiddenVideo, offsetX, offsetY, drawWidth, drawHeight, 0, 0, 1080, 1920);
                            frameReq = requestAnimationFrame(drawFrame);
                        }

                        let frameReq = requestAnimationFrame(drawFrame);
                        finalRecorder.start();

                        hiddenVideo.onended = () => {
                            if (finalRecorder.state !== 'inactive') finalRecorder.stop();
                            cancelAnimationFrame(frameReq);
                        };
                    } catch (e) {
                        alert('Scaling failed – raw recording is safe.');
                        console.error(e);
                    }
                };
                hiddenVideo.play();
            }

            // Event listeners
            startBtn.addEventListener('click', () => {
                // clear previous recording data, stop old stream
                recordedChunks = [];
                stopAllTracks();
                stopCountdown();
                startScreenAndCountdown();
            });

            stopBtn.addEventListener('click', stopAction);

            downloadBtn.addEventListener('click', () => {
                if (recordedChunks.length) scaleAndDownload();
            });

            // initial UI
            setUiForRecording(false);
        })();
    </script>
</body>
</html>
