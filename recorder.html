<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24h · max quality dual aspect recorder</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(145deg, #0b0f18 0%, #1a1f2c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(18, 22, 33, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 25px 40px -10px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,215,0,0.15);
            width: 780px;
            max-width: 94vw;
        }
        h1 {
            color: #f3e9c0;
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: -0.5px;
            margin: 0 0 0.25rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        h1 span {
            background: #9f7e1f;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.15rem 1rem;
            border-radius: 40px;
            color: #0e0b1a;
            letter-spacing: 0.3px;
        }
        .sub {
            color: #aca9bb;
            margin-bottom: 2rem;
            border-left: 3px solid #f5c542;
            padding-left: 1rem;
            font-size: 0.98rem;
        }
        .preview-container {
            background: #0c0f16;
            border-radius: 2rem;
            overflow: hidden;
            border: 2px solid #3f3d52;
            box-shadow: inset 0 0 15px #00000055;
            margin-bottom: 1.8rem;
            aspect-ratio: 9 / 16;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #171b24;
            transform: scaleX(-1);
            display: block;
            pointer-events: none;
        }
        .preview-label {
            position: absolute;
            bottom: 8px;
            right: 16px;
            background: #00000080;
            color: #ffd966;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            border: 1px solid #b58f3a;
            font-weight: 500;
            letter-spacing: 0.3px;
            z-index: 5;
        }
        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(3px);
            color: white;
            font-size: 7rem;
            font-weight: 900;
            text-shadow: 0 0 30px #ffb347, 0 0 10px black;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            border-radius: 2rem;
        }
        .countdown-overlay.visible {
            opacity: 1;
        }
        .aspect-toggle {
            display: flex;
            gap: 0.75rem;
            margin: 0 0 1.2rem 0;
            background: #1b1f2b;
            padding: 0.4rem;
            border-radius: 3rem;
            border: 1px solid #3e3c4a;
        }
        .aspect-option {
            flex: 1;
            text-align: center;
            padding: 0.6rem 0.8rem;
            border-radius: 2.5rem;
            background: transparent;
            color: #b1b9d0;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            border: none;
            letter-spacing: 0.3px;
        }
        .aspect-option.active {
            background: #2f374b;
            color: #ffdb8e;
            box-shadow: 0 2px 6px black;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            margin: 1.8rem 0 1.5rem;
        }
        button {
            background: #272b3a;
            border: none;
            color: #e9e1c7;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 0.8rem 1.8rem;
            border-radius: 2.5rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0d0f17;
            transition: 0.1s linear;
            border: 1px solid #5b5340;
            flex: 1 1 auto;
            justify-content: center;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0d0f17;
        }
        button:disabled {
            opacity: 0.4;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #0d0f17;
            pointer-events: none;
            filter: grayscale(0.6);
        }
        .record-btn {
            background: #8b2a2a;
            border-color: #c97c4b;
            box-shadow: 0 6px 0 #4d1a1a;
            color: white;
        }
        .stop-btn {
            background: #2f374b;
            border-color: #6f6d7a;
        }
        .download-btn {
            background: #2d5a3b;
            border-color: #64b07b;
            box-shadow: 0 6px 0 #1d3a25;
            color: #e6f0da;
        }
        .info-row {
            background: #1b1f2b;
            border-radius: 3rem;
            padding: 0.7rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #cbc5b2;
            border: 1px solid #47423b;
            font-size: 0.95rem;
            flex-wrap: wrap;
        }
        .badge {
            background: #323a4b;
            padding: 0.35rem 1rem;
            border-radius: 3rem;
            color: #ffdb8e;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .footnote {
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: #7b7a8a;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚡ 24h MAX recorder <span>ultra bitrate</span></h1>
        <div class="sub">▼ full original resolution · up to 24h · zero lag scaling</div>

        <div class="aspect-toggle" id="aspectToggle">
            <button class="aspect-option active" data-aspect="portrait">📱 9:16 &nbsp; (shorts)</button>
            <button class="aspect-option" data-aspect="landscape">🖥️ 16:9 &nbsp; (long form / 24h)</button>
        </div>

        <div class="preview-container" id="previewContainer" style="aspect-ratio: 9/16;">
            <video id="preview" autoplay playsinline muted></video>
            <div class="countdown-overlay" id="countdownOverlay">5</div>
            <div class="preview-label" id="previewLabel">9:16 preview</div>
        </div>

        <div class="controls">
            <button class="record-btn" id="startBtn">🔴 Start share (24h ready)</button>
            <button class="stop-btn" id="stopBtn" disabled>⏹️ Stop</button>
            <button class="download-btn" id="downloadBtn" disabled>💾 Download max quality</button>
        </div>

        <div class="info-row">
            <span>⏱️ <span id="timer">0:00</span></span>
            <span class="badge" id="status">⏸️ idle</span>
            <span>⚡ <span id="aspectIndicator">9:16</span> · raw first</span>
        </div>
        <div class="footnote">
            ⬇️ records original stream (no scaling during recording) → then transforms to selected aspect without quality loss. up to 24h.
        </div>
    </div>

    <script>
        (function() {
            // DOM elements
            const previewVideo = document.getElementById('preview');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const timerSpan = document.getElementById('timer');
            const statusSpan = document.getElementById('status');
            const countdownOverlay = document.getElementById('countdownOverlay');
            const previewContainer = document.getElementById('previewContainer');
            const previewLabel = document.getElementById('previewLabel');
            const aspectIndicator = document.getElementById('aspectIndicator');
            const aspectOptions = document.querySelectorAll('.aspect-option');

            // state
            let mediaStream = null;            
            let mediaRecorder = null;
            let recordedChunks = [];
            let startTime = 0;
            let timerInterval = null;
            let recordingStartTime = 0;          // for 24h limit check (optional, but we allow 24h)
            const MAX_RECORDING_MS = 24 * 60 * 60 * 1000; // 24h in milliseconds

            // countdown
            let countdownInterval = null;
            let countdownValue = 5;
            let isCountdownActive = false;

            // selected aspect
            let selectedAspect = 'portrait';   

            // UI update for aspect
            function updateAspectUI() {
                if (selectedAspect === 'portrait') {
                    previewContainer.style.aspectRatio = '9 / 16';
                    previewLabel.innerHTML = '9:16 preview · record full then transform';
                    aspectIndicator.innerText = '9:16';
                } else {
                    previewContainer.style.aspectRatio = '16 / 9';
                    previewLabel.innerHTML = '16:9 preview · long form max';
                    aspectIndicator.innerText = '16:9';
                }
            }

            aspectOptions.forEach(btn => {
                btn.addEventListener('click', () => {
                    aspectOptions.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedAspect = btn.dataset.aspect;
                    updateAspectUI();
                });
            });

            // timer format hh:mm:ss (for long recordings)
            function formatTime(seconds) {
                const hrs = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                const secs = Math.floor(seconds % 60);
                if (hrs > 0) {
                    return `${hrs}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            function updateTimer() {
                if (!startTime) return;
                const elapsed = (Date.now() - startTime) / 1000;
                timerSpan.textContent = formatTime(elapsed);
            }

            function startTimer() {
                stopTimer();
                startTime = Date.now();
                timerSpan.textContent = '0:00';
                timerInterval = setInterval(updateTimer, 200);
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                startTime = 0;
            }

            function setUiForRecording(recording) {
                if (recording) {
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    downloadBtn.disabled = true;
                    statusSpan.innerHTML = '🔴 recording (max 24h)';
                } else {
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                    downloadBtn.disabled = recordedChunks.length === 0;
                    statusSpan.innerHTML = recordedChunks.length ? '⏸️ stopped · ready' : '⏹️ idle';
                }
            }

            function stopAllTracks() {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }
                previewVideo.srcObject = null;
            }

            function stopCountdown() {
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                countdownOverlay.classList.remove('visible');
                isCountdownActive = false;
            }

            // 24h safety inside recording – if time exceeds, auto-stop
            function checkMaxDuration() {
                if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
                const elapsed = Date.now() - recordingStartTime;
                if (elapsed >= MAX_RECORDING_MS) {
                    console.log('24h limit reached, stopping recorder');
                    mediaRecorder.stop();
                }
            }

            async function startScreenAndCountdown() {
                recordedChunks = [];
                downloadBtn.disabled = true;
                stopAllTracks();
                stopCountdown();

                try {
                    // request highest possible quality
                    const displayStream = await navigator.mediaDevices.getDisplayMedia({
                        video: {
                            width: { ideal: 3840 },  // request 4k if available
                            height: { ideal: 2160 },
                            frameRate: { ideal: 60 },
                        },
                        audio: true,
                    });

                    // mic
                    let micStream = null;
                    try {
                        micStream = await navigator.mediaDevices.getUserMedia({ 
                            audio: {
                                echoCancellation: true,
                                noiseSuppression: true,
                                sampleRate: { ideal: 48000 },
                            } 
                        });
                    } catch (e) {}

                    // combine audio
                    const audioTracks = [];
                    displayStream.getAudioTracks().forEach(t => audioTracks.push(t));
                    if (micStream) {
                        micStream.getAudioTracks().forEach(t => audioTracks.push(t));
                    }

                    const videoTrack = displayStream.getVideoTracks()[0];
                    if (!videoTrack) throw new Error('No video track');

                    let finalStream;
                    if (audioTracks.length) {
                        finalStream = new MediaStream([videoTrack, ...audioTracks]);
                    } else {
                        finalStream = displayStream;
                    }

                    mediaStream = finalStream;
                    previewVideo.srcObject = mediaStream;

                    videoTrack.onended = () => {
                        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                            mediaRecorder.stop();
                        }
                        stopAllTracks();
                        stopCountdown();
                        setUiForRecording(false);
                        statusSpan.innerHTML = '⏹️ sharing stopped';
                    };

                    startCountdown();

                } catch (err) {
                    console.error('Screen capture error:', err);
                    statusSpan.innerHTML = '⚠️ sharing cancelled/denied';
                    setUiForRecording(false);
                }
            }

            function startCountdown() {
                stopCountdown();
                countdownValue = 5;
                countdownOverlay.textContent = countdownValue;
                countdownOverlay.classList.add('visible');
                isCountdownActive = true;

                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusSpan.innerHTML = '⏳ recording starts in 5...';

                countdownInterval = setInterval(() => {
                    countdownValue -= 1;
                    countdownOverlay.textContent = countdownValue;

                    if (countdownValue <= 0) {
                        stopCountdown(); 

                        if (!mediaStream) {
                            statusSpan.innerHTML = '⚠️ stream lost';
                            setUiForRecording(false);
                            return;
                        }

                        try {
                            // Use high bitrate, max quality, and timeslice to avoid memory explosion
                            // also we want to handle large recordings, so we use { timeslice: 5000 } if needed? but ondataavailable will fire automatically.
                            // For long recordings we keep mimeType high.

                            // Prefer high bitrate and hardware-accelerated codec
                            const mimeTypes = [
                                'video/webm;codecs=vp9,opus',
                                'video/webm;codecs=vp8,opus',
                                'video/webm;codecs=vp8',
                                'video/webm'
                            ];
                            let selectedMime = 'video/webm;codecs=vp8,opus';
                            for (let mt of mimeTypes) {
                                if (MediaRecorder.isTypeSupported(mt)) {
                                    selectedMime = mt;
                                    break;
                                }
                            }

                            // Use very high bitrate (50 Mbps) for near-lossless, but browser may clamp.
                            // We also pass videoBitsPerSecond as a hint.
                            mediaRecorder = new MediaRecorder(mediaStream, {
                                mimeType: selectedMime,
                                videoBitsPerSecond: 50000000,  // 50 Mbps (browser may limit)
                                audioBitsPerSecond: 320000,
                            });

                            mediaRecorder.ondataavailable = (e) => {
                                if (e.data.size > 0) recordedChunks.push(e.data);
                            };

                            mediaRecorder.onstop = () => {
                                stopTimer();
                                setUiForRecording(false);
                            };

                            mediaRecorder.start();
                            recordingStartTime = Date.now();
                            startTimer();
                            setUiForRecording(true);
                            statusSpan.innerHTML = '🔴 recording max quality';

                            // set an interval to check 24h limit every minute (optional, but nice)
                            const maxDurationInterval = setInterval(() => {
                                if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                                    clearInterval(maxDurationInterval);
                                    return;
                                }
                                if (Date.now() - recordingStartTime >= MAX_RECORDING_MS) {
                                    mediaRecorder.stop();
                                    clearInterval(maxDurationInterval);
                                }
                            }, 60000);

                        } catch (e) {
                            console.error('Recorder failed:', e);
                            statusSpan.innerHTML = '⚠️ recorder error';
                        }
                    }
                }, 1000);
            }

            function stopAction() {
                if (isCountdownActive) {
                    stopCountdown();
                    statusSpan.innerHTML = '⏸️ countdown cancelled';
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                } else if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                } else {
                    stopAllTracks();
                    setUiForRecording(false);
                }
            }

            // ---------- HIGH-QUALITY TRANSFORM (NO LAG, FAST, PRESERVES ORIGINAL) ----------
            function scaleAndDownload() {
                if (recordedChunks.length === 0) return;

                // Combine chunks into a blob
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const hiddenVideo = document.createElement('video');
                hiddenVideo.src = url;
                hiddenVideo.muted = false;
                hiddenVideo.crossOrigin = 'anonymous';
                hiddenVideo.playsInline = true;
                hiddenVideo.preload = 'auto';

                hiddenVideo.onloadedmetadata = async () => {
                    try {
                        // Play to ensure frames are ready
                        await hiddenVideo.play();

                        // Use original video dimensions (preserve all quality)
                        const vw = hiddenVideo.videoWidth;
                        const vh = hiddenVideo.videoHeight;

                        // Set canvas dimensions to selected aspect, but keep max resolution (at least HD, but could be bigger)
                        let canvasWidth, canvasHeight;
                        if (selectedAspect === 'portrait') {
                            // 9:16 → we keep width as min(vw, 1080?) no, we use max to preserve detail:
                            // we base on original height for portrait: height = originalHeight (or up to 4k)
                            // But we must maintain 9:16 aspect: width = height * 9/16
                            canvasHeight = Math.min(vh, 3840); // limit to 4k to avoid canvas crash
                            canvasWidth = Math.round(canvasHeight * 9/16);
                            // ensure even dimensions
                            if (canvasWidth % 2) canvasWidth += 1;
                            if (canvasHeight % 2) canvasHeight += 1;
                        } else {
                            // landscape 16:9: base width = vw (or max 3840)
                            canvasWidth = Math.min(vw, 3840);
                            canvasHeight = Math.round(canvasWidth * 9/16);
                            if (canvasWidth % 2) canvasWidth += 1;
                            if (canvasHeight % 2) canvasHeight += 1;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = canvasWidth;
                        canvas.height = canvasHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';

                        // capture canvas stream at original FPS (estimate 30)
                        const canvasStream = canvas.captureStream(30);
                        const originalAudio = hiddenVideo.captureStream().getAudioTracks();
                        const canvasVideoTrack = canvasStream.getVideoTracks()[0];

                        const finalStream = new MediaStream();
                        finalStream.addTrack(canvasVideoTrack);
                        originalAudio.forEach(t => finalStream.addTrack(t));

                        // high bitrate for output
                        const finalRecorder = new MediaRecorder(finalStream, {
                            mimeType: 'video/webm;codecs=vp9,opus',
                            videoBitsPerSecond: 50000000,
                            audioBitsPerSecond: 320000,
                        });
                        const scaledChunks = [];
                        finalRecorder.ondataavailable = (e) => scaledChunks.push(e.data);
                        finalRecorder.onstop = () => {
                            const finalBlob = new Blob(scaledChunks, { type: 'video/webm' });
                            const finalUrl = URL.createObjectURL(finalBlob);
                            const a = document.createElement('a');
                            a.href = finalUrl;
                            const aspectTag = selectedAspect === 'portrait' ? 'portrait_9x16' : 'landscape_16x9';
                            a.download = `${aspectTag}_max_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.webm`;
                            a.click();
                            URL.revokeObjectURL(finalUrl);
                            statusSpan.innerHTML = `✅ max quality ready (${aspectTag})`;
                        };

                        // drawing routine with correct cropping
                        function drawFrame() {
                            if (hiddenVideo.paused || hiddenVideo.ended) {
                                if (finalRecorder.state !== 'inactive') finalRecorder.stop();
                                cancelAnimationFrame(frameReq);
                                return;
                            }
                            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

                            const targetAspect = (selectedAspect === 'portrait') ? 9/16 : 16/9;
                            const videoAspect = vw / vh;

                            let drawWidth, drawHeight, offsetX = 0, offsetY = 0;

                            if (selectedAspect === 'portrait') { // 9:16
                                if (videoAspect > targetAspect) {
                                    drawHeight = vh;
                                    drawWidth = vh * targetAspect;
                                    offsetX = (vw - drawWidth) / 2;
                                } else {
                                    drawWidth = vw;
                                    drawHeight = vw / targetAspect;
                                    offsetY = (vh - drawHeight) / 2;
                                }
                            } else { // landscape 16:9
                                if (videoAspect > targetAspect) {
                                    drawHeight = vh;
                                    drawWidth = vh * targetAspect;
                                    offsetX = (vw - drawWidth) / 2;
                                } else {
                                    drawWidth = vw;
                                    drawHeight = vw / targetAspect;
                                    offsetY = (vh - drawHeight) / 2;
                                }
                            }

                            ctx.drawImage(hiddenVideo, offsetX, offsetY, drawWidth, drawHeight, 0, 0, canvasWidth, canvasHeight);
                            frameReq = requestAnimationFrame(drawFrame);
                        }

                        let frameReq = requestAnimationFrame(drawFrame);
                        finalRecorder.start();

                        hiddenVideo.onended = () => {
                            if (finalRecorder.state !== 'inactive') finalRecorder.stop();
                            cancelAnimationFrame(frameReq);
                        };
                    } catch (e) {
                        alert('Scaling failed – but raw recording is safe. Try downloading raw?');
                        console.error(e);
                    }
                };
                hiddenVideo.play();
            }

            startBtn.addEventListener('click', () => {
                recordedChunks = [];
                stopAllTracks();
                stopCountdown();
                startScreenAndCountdown();
            });

            stopBtn.addEventListener('click', stopAction);

            downloadBtn.addEventListener('click', () => {
                if (recordedChunks.length) scaleAndDownload();
            });

            setUiForRecording(false);
            updateAspectUI();
        })();
    </script>
</body>
</html>
